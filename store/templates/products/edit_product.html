{% extends 'base.html' %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold mb-0 text-dark" style="font-size: 1.5rem;">Edit Product</h2>
                        <a href="{% url 'product_list' %}" class="btn-close shadow-none"></a>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.5px;">Price</label>
                            <input type="number" 
                                   name="price" 
                                   class="form-control form-control-lg border-secondary-subtle" 
                                   value="{{ product.price }}" 
                                   step="0.01" 
                                   style="border-radius: 8px; font-size: 1rem;" 
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.5px;">Image URL</label>
                            <input type="text" 
                                   name="image_url" 
                                   class="form-control form-control-lg border-secondary-subtle" 
                                   value="{{ product.image_url }}" 
                                   style="border-radius: 8px; font-size: 1rem;" 
                                   required>
                        </div>

                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center" style="border-radius: 10px; background-color: #ffc107; height: 55px;">
                            <i class="bi bi-check2 me-2 fs-5"></i> Update Product
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'product_list' %}" class="text-decoration-none text-muted small fw-bold text-uppercase" style="letter-spacing: 1px;">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



{% endblock %}
