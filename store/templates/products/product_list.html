{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0">All Products</h2>
    <a href="{% url 'add_product' %}" class="btn btn-dark fw-bold rounded-pill px-4">
        <i class="bi bi-plus-lg me-2"></i> Add Products
    </a>
</div>

<div class="row">
{% for product in products %}
<div class="col-md-4 mb-4">
    <div class="card h-100 border-0 shadow-sm" style="border-radius: 20px; overflow: hidden;">
        
        <img src="{{ product.image_url }}" 
             class="card-img-top" 
             style="height:250px; object-fit:cover;">

        <div class="card-body bg-white text-center">
            <h5 class="card-title fw-bold mb-1">{{ product.title }}</h5>
            <p class="text-muted mb-3"><strong>₹{{ product.price }}</strong></p>

            <div class="d-flex justify-content-center gap-2 mt-3">

                <a href="{{ product.image_url }}"
                   class="btn btn-dark btn-sm rounded-circle d-flex align-items-center justify-content-center"
                   style="width: 35px; height: 35px;"
                   download
                   title="Download">
                    <i class="bi bi-download text-white"></i>
                </a>

                <form method="POST" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="product_id" value="{{ product.id }}">
                    <button type="submit"
                            name="action"
                            value="save_product"
                            class="btn btn-dark btn-sm rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 35px; height: 35px;"
                            title="Save">
                        <i class="bi bi-bookmark text-white"></i>
                    </button>
                </form>

                <button class="btn btn-dark btn-sm rounded-circle d-flex align-items-center justify-content-center"
                        style="width: 35px; height: 35px;"
                        data-bs-toggle="modal"
                        data-bs-target="#editModal{{ product.id }}"
                        title="Edit">
                    <i class="bi bi-pencil text-white"></i>
                </button>

                <a href="{% url 'delete_product' product.pk %}"
                   class="btn btn-dark btn-sm rounded-circle d-flex align-items-center justify-content-center"
                   style="width: 35px; height: 35px;"
                   onclick="return confirm('Are you sure?');"
                   title="Delete">
                    <i class="bi bi-trash text-white"></i>
                </a>

            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal{{ product.id }}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
                
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold text-dark">Edit Product</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-4 text-start">
                    <form method="POST" action="{% url 'edit_product' product.id %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.5px;">Price</label>
                            <input type="number" 
                                   name="price" 
                                   value="{{ product.price }}" 
                                   class="form-control form-control-lg border-secondary-subtle" 
                                   style="border-radius: 10px; font-size: 1rem;"
                                   step="0.01" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase" style="letter-spacing: 0.5px;">Image URL</label>
                            <input type="text" 
                                   name="image_url" 
                                   value="{{ product.image_url }}" 
                                   class="form-control form-control-lg border-secondary-subtle" 
                                   style="border-radius: 10px; font-size: 1rem;"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 shadow-sm d-flex align-items-center justify-content-center" 
                                style="border-radius: 12px; background-color: #151512; border: none; color: white; height: 45px;">
                            <i class="bi bi-check2 me-2 fs-5"></i> Update Product
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>
{% endfor %}
</div>

{% endblock %}
